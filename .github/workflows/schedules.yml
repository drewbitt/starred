name: update awesome-stars

on:
  workflow_dispatch:
  schedule:
    - cron: '37 4 * * *'

permissions:
  contents: write

jobs:
  awesome-stars:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      # The runner relies on these packages' renderer and client APIs.
      - name: Install dependencies
        run: python -m pip install 'starred==4.3.0' 'gql==3.5.3'
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Generate lists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python run_starred.py --username "$GITHUB_REPOSITORY_OWNER"
      - name: Commit changed lists
        env:
          GIT_AUTHOR_NAME: Andrew
          GIT_AUTHOR_EMAIL: andrew@drewbitt.com
          GIT_COMMITTER_NAME: Andrew
          GIT_COMMITTER_EMAIL: andrew@drewbitt.com
        run: |
          git add README.md topics.md
          if ! git diff --cached --quiet; then
            git commit -m "Update starred repositories"
            git push
          fi
